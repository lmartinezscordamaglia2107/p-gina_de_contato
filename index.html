<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Meu Site</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

    <section class="contact-container">
        <div class="contact-box">
            <h2>Entre em Contato</h2>
            <p>Tem alguma dúvida? Mande uma mensagem para nós!</p>

            <form id="contactForm">
                <div class="input-group">
                    <label for="name">Nome</label>
                    <input type="text" id="name" placeholder="Seu nome completo" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="input-group">
                    <label for="message">Mensagem</label>
                    <textarea id="message" rows="5" placeholder="Como podemos ajudar?" required></textarea>
                </div>

                <button type="submit" id="submitBtn">Enviar Mensagem</button>
            </form>
            
            <div id="responseMessage" class="hidden"></div>
        </div>
    </section>

    <script src="index.js"></script>
</body>
</html>
